<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NASCH</title><style>body{font-family:Arial;background:#f4f6f9;color:#172033;margin:0}.w{max-width:520px;margin:48px auto;padding:20px}.c{background:#fff;border:1px solid #dbe2ea;border-radius:14px;padding:18px}.a{display:block;padding:13px 14px;margin:8px 0;border-radius:9px;background:#1e3a5f;color:#fff;text-decoration:none;font-weight:700}.m{background:#111827}.sub{color:#64748b;font-size:13px;line-height:1.5}</style><link rel="stylesheet" href="./nasch-v2934.css">
</head><body><div class="w"><div class="c"><h1>NASCH</h1><p class="sub">Bitte den passenden Zugang öffnen.</p><a class="a" href="emsdetten.html">Emsdetten</a><a class="a" href="lohne.html">Lohne</a><a class="a" href="werlte.html">Werlte</a><a class="a" href="loeningen.html">Löningen</a><a class="a m" href="leitung.html">Leitung & Personalbüro</a></div></div><script src="./nasch-v2934.js"></script>

<!-- NASCH v29.28 · Stundenübersicht / Stundenzettel Rollenrechte -->
<style id="nasch-v2928-hours-overview-css">
  .n297-overview-table{width:100%;border-collapse:collapse;font-size:11px;min-width:640px}
  .n297-overview-table th{padding:7px 8px;text-align:left;background:#f8fafc;white-space:nowrap}
  .n297-overview-table td{padding:8px;border-top:1px solid var(--border);vertical-align:top}
  .n297-overview-table .r{text-align:right;white-space:nowrap}
  .n297-summary{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:7px;margin-top:9px}
  .n297-summary>div{background:#f8fafc;border:1px solid var(--border);border-radius:9px;padding:8px 9px}
  .n297-summary small{display:block;color:var(--muted);font-size:9px;margin-bottom:2px}
  .n297-summary strong{font-size:12px;color:var(--navy)}
  .n297-detail-btn{border:1px solid var(--border);background:#fff;border-radius:8px;padding:5px 8px;font-size:10px;font-weight:700;color:var(--navy);cursor:pointer}
  @media(min-width:650px){.n297-summary{grid-template-columns:repeat(5,minmax(0,1fr))}}
</style>
<script id="nasch-v2928-hours-overview-js">
(()=>{
  const VERSION='29.28';
  const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const uidNow=()=>String(window.AppState?.currentUserId||'');
  const currentUser=()=>window.USERS?.[uidNow()]||window.AppState?.currentUser||null;
  const isCentral=()=>{try{return window.BranchSandbox?.isCentral?.(uidNow())===true}catch(_){return false}};
  const isOffice=()=>{try{return window.BranchSandbox?.isOffice?.(uidNow())===true}catch(_){return false}};
  const isBranchAdmin=()=>{const u=currentUser();return !!u&&u.role==='admin'&&!isCentral()&&!isOffice()};
  const isDeputy=()=>{try{return !isBranchAdmin()&&window.NaschDeputyFeature?.isDeputy?.(uidNow())===true}catch(_){return false}};
  const de2=n=>(Math.round((Number(n)||0)*100)/100).toFixed(2).replace('.',',');
  const pauseDecimal=min=>de2((Number(min)||0)/60);
  const days=n=>`${n} ${n===1?'Tag':'Tage'}`;
  const monthValue=()=>`${new Date().getFullYear()}-${String(new Date().getMonth()+1).padStart(2,'0')}`;
  const eligible=uid=>{try{return typeof getEmployeeSurchargeEnabled==='function'&&!!getEmployeeSurchargeEnabled(uid)}catch(_){return false}};
  const activeEmployees=()=>{try{return typeof activeEmployeeEntries==='function'?activeEmployeeEntries():(typeof getOrderedUserEntries==='function'?getOrderedUserEntries():Object.entries(USERS||{})).filter(([id,u])=>u&&u.name&&u.role!=='office'&&!['BU','SYS'].includes(u.typ||''))}catch(_){return []}};
  function rowStatus(r){const t=String(r?.shiftType||'');if(t==='K')return'Krank';if(t==='U')return'Urlaub';if(t==='KK')return'Kind krank';if(t==='BS')return'Berufsschule';return String(r?.displayStatus||r?.status||'')}
  function isWorked(r){return (Array.isArray(r?.ranges)&&r.ranges.length>0)||(Number(r?.net)||0)>0||r?.corrected===true}
  function isRelevantAbsence(r){return ['K','U','KK','BS'].includes(String(r?.shiftType||''))}
  function noHourStatus(r){return ['K','U','KK'].includes(String(r?.shiftType||''))}
  function visibleRows(data){return (data?.rows||[]).filter(r=>isWorked(r)||isRelevantAbsence(r))}
  function hoursCell(r){return !noHourStatus(r)&&isWorked(r)?de2(r.net):'–'}
  function timeCell(r){if(noHourStatus(r))return rowStatus(r)||'–';if(isWorked(r)&&Array.isArray(r.ranges)&&r.ranges.length)return r.ranges.map(x=>`${x[0]}–${x[1]}`).join(' / ')+(r.corrected?' · korrigiert':'');return rowStatus(r)||'–'}
  function surchargeCell(r,key){if(noHourStatus(r)||!isWorked(r))return'–';const v=Number(r?.[key])||0;return v>0?de2(v):'–'}
  function absenceCounts(data){let krank=0,urlaub=0,kk=0;for(const r of data?.rows||[]){const t=String(r?.shiftType||'');if(t==='K')krank++;else if(t==='U')urlaub++;else if(t==='KK')kk++;}return{krank,urlaub,kk}}
  function pauseTotal(data){return (data?.rows||[]).reduce((s,r)=>s+(!noHourStatus(r)&&isWorked(r)?Number(r.pauseMin)||0:0),0)}
  function monthOptions(id,value){const now=new Date(),opts=[];for(let i=-12;i<=1;i++){const d=new Date(now.getFullYear(),now.getMonth()+i,1),v=`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`,l=d.toLocaleDateString('de-DE',{month:'long',year:'numeric'});opts.push(`<option value="${v}"${v===value?' selected':''}>${esc(l)}</option>`)}return `<select id="${id}">${opts.join('')}</select>`}
  async function dataFor(uid,ym){const [y,m]=String(ym||monthValue()).split('-').map(Number);const fn=window.NaschMonthlyTimesheet?.monthData;if(typeof fn!=='function')throw new Error('Monatsdaten sind noch nicht geladen.');return fn(String(uid),y,m)}
  function employeeTable(data,uid){const showS=eligible(uid),rows=visibleRows(data),c=absenceCounts(data),p=pauseTotal(data);let body='';for(const r of rows){const date=new Date(`${r.date}T12:00:00`).toLocaleDateString('de-DE',{weekday:'short',day:'2-digit',month:'2-digit'});body+=`<tr><td><strong>${esc(date)}</strong>${r.holiday?`<div style="font-size:9px;color:var(--muted)">${esc(r.holiday)}</div>`:''}</td><td>${esc(timeCell(r))}</td><td class="r">${(!noHourStatus(r)&&isWorked(r))?pauseDecimal(r.pauseMin):'–'}</td><td class="r"><strong>${hoursCell(r)}</strong></td>${showS?`<td class="r">${surchargeCell(r,'p25')}</td><td class="r">${surchargeCell(r,'p50')}</td>`:''}</tr>`}
    if(!body)body=`<tr><td colspan="${showS?6:4}" style="text-align:center;color:var(--muted);padding:16px">Für diesen Monat sind keine relevanten Einträge vorhanden.</td></tr>`;
    return `<div style="overflow-x:auto"><table class="n297-overview-table" style="min-width:${showS?'700':'520'}px"><thead><tr><th>Datum</th><th>Arbeitszeit / Status</th><th class="r">Pause</th><th class="r">Stunden</th>${showS?'<th class="r">25 %</th><th class="r">50 %</th>':''}</tr></thead><tbody>${body}</tbody></table></div><div class="n297-summary"><div><small>Gearbeitet</small><strong>${de2(data.worked)} h</strong></div><div><small>Pause</small><strong>${pauseDecimal(p)} h</strong></div><div><small>Krank</small><strong>${days(c.krank)}</strong></div><div><small>Urlaub</small><strong>${days(c.urlaub)}</strong></div>${showS?`<div><small>Zuschläge</small><strong>25 % ${de2(data.p25)} · 50 % ${de2(data.p50)}</strong></div>`:''}</div><div style="font-size:9px;color:var(--muted);margin-top:8px">Leere/freie Tage werden ausgeblendet. Krank und Urlaub erscheinen nur als Status und ohne Stunden. Pause wird als Dezimalstunde angezeigt (30 Min. = 0,50).</div>`
  }
  async function renderEmployeeOverview(){const box=document.getElementById('personalDailyHours');if(!box||!uidNow())return;const sel=document.getElementById('n293EmpMonth'),ym=sel?.value||monthValue();box.innerHTML='<div class="card-b" style="color:var(--muted)">Stundenübersicht wird geladen …</div>';try{const data=await dataFor(uidNow(),ym);box.innerHTML=employeeTable(data,uidNow())}catch(e){box.innerHTML=`<div class="card-b" style="color:#b91c1c">Stundenübersicht konnte nicht geladen werden: ${esc(e.message||e)}</div>`}}
  function ensureEmployeePage(){const p=document.getElementById('pgStunden');if(!p)return;const topWarn=p.querySelector(':scope > .banner.bwarn');if(topWarn)topWarn.style.display='none';const stats=p.querySelector(':scope > .stat-grid');if(stats)stats.style.display='none';const box=document.getElementById('personalDailyHours'),card=box?.closest('.card');if(card){const t=card.querySelector('.card-t');if(t)t.textContent='📋 Stundenübersicht';}const pdf=document.getElementById('personalTimesheetPdfCard');if(pdf)pdf.style.setProperty('display','none','important');const mon=document.getElementById('n293EmployeeMonthly');if(mon){const h=mon.querySelector('.n293-head');if(h)h.textContent='✍️ Monatsbestätigung';}setTimeout(renderEmployeeOverview,0)}
  function ensureAdminOverviewPage(){if(document.getElementById('pgAdminHours'))return;const anchor=document.getElementById('pgAdminStz');if(!anchor)return;const p=document.createElement('div');p.className='page';p.id='pgAdminHours';p.innerHTML=`<div class="back" onclick="goTo('pgAdmin','Admin')">‹ Zurück</div><div class="sec">Stundenübersicht · alle Mitarbeiter</div><div class="card" style="margin-bottom:10px"><div class="card-b"><label style="margin-top:0">Monat</label>${monthOptions('n297AdminMonth',monthValue())}</div></div><div id="n297AdminSummary"></div><div id="n297AdminDetail"></div>`;anchor.parentNode.insertBefore(p,anchor);p.querySelector('#n297AdminMonth')?.addEventListener('change',renderAdminOverview)}
  function ensureAdminMenu(){const menu=document.querySelector('#pgAdmin .menu-list');if(!menu)return;let stz=[...menu.querySelectorAll('.mi')].find(x=>/Stundenzettel/i.test(x.textContent||''));if(stz&&!stz.id)stz.id='adminTimesheetMenu';if(stz&&stz.dataset.n297!=='1'){stz.dataset.n297='1';stz.setAttribute('onclick',"goTo('pgAdminStz','Stundenzettel')");}let h=document.getElementById('adminHoursOverviewMenu');if(!h&&stz){h=document.createElement('div');h.className='mi';h.id='adminHoursOverviewMenu';h.setAttribute('onclick',"goTo('pgAdminHours','Stundenübersicht');setTimeout(()=>window.NaschHoursOverview?.renderAdmin?.(),0)");h.innerHTML='<div class="mi-icon" style="background:#E6F1FB;">⏱</div><span class="mi-lbl">Stundenübersicht</span><span class="mi-arr">›</span>';stz.parentNode.insertBefore(h,stz)}
    if(h)h.style.display=isBranchAdmin()?'flex':'none';if(stz){stz.style.display=(isBranchAdmin()||isDeputy())?'flex':'none';const lbl=stz.querySelector('.mi-lbl');if(lbl)lbl.textContent='Stundenzettel';stz.setAttribute('onclick',"goTo('pgAdminStz','Stundenzettel')")}}
  async function renderAdminOverview(){const host=document.getElementById('n297AdminSummary');if(!host)return;if(!isBranchAdmin()){host.innerHTML='<div class="banner bwarn"><span>🔒</span><span>Diese Übersicht ist nur für den Admin / die Filialleitung verfügbar.</span></div>';return}const ym=document.getElementById('n297AdminMonth')?.value||monthValue(),entries=activeEmployees();host.innerHTML='<div class="card"><div class="card-b" style="color:var(--muted)">Monatsübersicht wird geladen …</div></div>';try{const data=await Promise.all(entries.map(async([uid,u])=>[uid,u,await dataFor(uid,ym)]));let rows='';for(const [uid,u,d] of data){const c=absenceCounts(d),p=pauseTotal(d),showS=eligible(uid);rows+=`<tr><td><strong>${esc(u.name)}</strong><div style="font-size:9px;color:var(--muted)">${esc(u.label||u.typ||'')}</div></td><td class="r"><strong>${de2(d.worked)}</strong></td><td class="r">${pauseDecimal(p)}</td><td class="r">${days(c.krank)}</td><td class="r">${days(c.urlaub)}</td><td class="r">${showS?de2(d.p25):'–'}</td><td class="r">${showS?de2(d.p50):'–'}</td><td class="r"><button class="n297-detail-btn" onclick="NaschHoursOverview.showEmployee('${esc(uid)}')">Details</button></td></tr>`}host.innerHTML=`<div class="banner binfo" style="margin-bottom:8px"><span>⏱</span><span>Allgemeine Monats-Stundenübersicht aller aktiven Mitarbeiter. Krank und Urlaub werden als Tage, nicht als Stunden dargestellt.</span></div><div class="card"><div class="card-b" style="overflow-x:auto;padding:0"><table class="n297-overview-table" style="min-width:760px"><thead><tr><th>Mitarbeiter</th><th class="r">Gearbeitet</th><th class="r">Pause</th><th class="r">Krank</th><th class="r">Urlaub</th><th class="r">25 %</th><th class="r">50 %</th><th></th></tr></thead><tbody>${rows||'<tr><td colspan="8">Keine Mitarbeiter.</td></tr>'}</tbody></table></div></div><div style="font-size:9px;color:var(--muted);margin-top:7px">Stunden und Pausen werden dezimal angezeigt. Zuschläge erscheinen nur bei Mitarbeitern mit aktivierter Zuschlagsberechtigung.</div>`}catch(e){host.innerHTML=`<div class="banner bwarn"><span>⚠️</span><span>${esc(e.message||e)}</span></div>`}}
  async function showEmployee(uid){if(!isBranchAdmin())return;const host=document.getElementById('n297AdminDetail');if(!host)return;const ym=document.getElementById('n297AdminMonth')?.value||monthValue();host.innerHTML='<div class="card"><div class="card-b" style="color:var(--muted)">Details werden geladen …</div></div>';try{const d=await dataFor(uid,ym),u=USERS?.[uid]||{};host.innerHTML=`<div class="sec" style="margin-top:14px">${esc(u.name||uid)} · Detailübersicht</div><div class="card"><div class="card-b">${employeeTable(d,uid)}</div></div>`;host.scrollIntoView({behavior:'smooth',block:'start'})}catch(e){host.innerHTML=`<div class="banner bwarn"><span>⚠️</span><span>${esc(e.message||e)}</span></div>`}}
  function restrictTimesheets(){const p=document.getElementById('pgAdminStz');if(!p)return;const pageBanner=p.querySelector(':scope > .banner.binfo');if(pageBanner&&isDeputy())pageBanner.innerHTML='<span>📄</span><span>Stundenzettel ansehen und nach gültiger Mitarbeiter-Unterschrift gegenzeichnen. PDF-Speichern ist erlaubt; Mailversand bleibt der Filialleitung vorbehalten.</span>';const daily=document.getElementById('adminDailyHours');if(daily){daily.style.display='none';const sec=daily.previousElementSibling;if(sec&&/Stundenzettel|Stunden/i.test(sec.textContent||''))sec.style.display='none'}const monthly=document.getElementById('n293AdminMonthly');if(monthly){const mh=monthly.querySelector('.n293-head');if(mh&&isDeputy())mh.textContent='📄 Monats-Stundenzettel · Gegenzeichnung';else if(mh&&isBranchAdmin())mh.textContent='📄 Monats-Stundenzettel · Filiale';const pdf=[...monthly.querySelectorAll('button')].find(b=>/^PDF$/i.test((b.textContent||'').trim()));if(pdf)pdf.style.display=(isBranchAdmin()||isDeputy())?'':'none'}const office=document.getElementById('n293OfficeMonthly');if(office&&isOffice())office.style.removeProperty('display')}
  function renameEmployeeMenu(){const items=[...document.querySelectorAll('#pgProfil .mi')];for(const x of items){if(/Stundenzettel/i.test(x.textContent||'')){const l=x.querySelector('.mi-lbl');if(l)l.textContent='Stundenübersicht';x.setAttribute('onclick',"goTo('pgStunden','Stundenübersicht')")}}}
  function guardPdf(){const canRead=()=>isBranchAdmin()||isDeputy()||isOffice();if(window.NaschTimesheetPDF&&!window.NaschTimesheetPDF.__n298){const api=window.NaschTimesheetPDF;['openOwn','openOfficeSelected','openSelected','openAll'].forEach(k=>{if(typeof api[k]==='function'){const old=api[k];api[k]=function(){if(!canRead()){alert('Keine Berechtigung für Stundenzettel/PDF-Nachweise.');return}return old.apply(this,arguments)}}});api.__n298=true}}
  function syncMonth(){const s=document.getElementById('n293EmpMonth');if(s&&!s.dataset.n297){s.dataset.n297='1';s.addEventListener('change',()=>setTimeout(renderEmployeeOverview,0))}}
  function apply(){renameEmployeeMenu();ensureAdminOverviewPage();ensureAdminMenu();ensureEmployeePage();restrictTimesheets();guardPdf();syncMonth()}
  const oldGo=window.goTo;if(typeof oldGo==='function'&&!oldGo.__n297){const fn=function(pg,title){if(pg==='pgAdminHours'&&!isBranchAdmin()){alert('Die allgemeine Stundenübersicht aller Mitarbeiter ist nur für den Admin / die Filialleitung verfügbar.');return}if(pg==='pgAdminStz'&&!(isBranchAdmin()||isDeputy())){alert('Dieser Bereich ist nicht freigegeben.');return}const r=oldGo.apply(this,arguments);setTimeout(()=>{apply();if(pg==='pgStunden')renderEmployeeOverview();if(pg==='pgAdminHours')renderAdminOverview()},20);return r};fn.__n297=true;window.goTo=fn;try{goTo=fn}catch(_){}}
  const oldStart=window.startApp;if(typeof oldStart==='function'&&!oldStart.__n297){const fn=function(){const r=oldStart.apply(this,arguments);setTimeout(apply,350);return r};fn.__n297=true;window.startApp=fn;try{startApp=fn}catch(_){}}
  const obs=new MutationObserver(()=>{const o=document.getElementById('n293OfficeMonthly');if(o&&isOffice())o.style.removeProperty('display');const e=document.getElementById('n293EmployeeMonthly');if(e){const h=e.querySelector('.n293-head');if(h&&/Arbeitszeiten/.test(h.textContent||''))h.textContent='✍️ Monatsbestätigung'}restrictTimesheets();syncMonth()});
  document.addEventListener('DOMContentLoaded',()=>{apply();obs.observe(document.body,{childList:true,subtree:true});setTimeout(apply,400)},{once:true});setTimeout(apply,120);
  window.NaschHoursOverview={renderEmployee:renderEmployeeOverview,renderAdmin:renderAdminOverview,showEmployee,isBranchAdmin};
  console.info('NASCH v'+VERSION+' Stundenübersicht/Stundenzettel-Rollenrechte aktiv');
})();
</script>
