<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>NASCH Mitarbeiter-App</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="NASCH">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    background: #0f1f0a;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: env(safe-area-inset-top,16px) 16px env(safe-area-inset-bottom,16px);
  }
  .wrap {
    width: 100%;
    max-width: 360px;
    text-align: center;
  }
  .logo {
    margin-bottom: 32px;
  }
  .logo h1 {
    font-size: 28px;
    font-weight: 900;
    color: #98C01F;
    letter-spacing: -0.5px;
  }
  .logo p {
    font-size: 13px;
    color: rgba(255,255,255,0.5);
    margin-top: 4px;
  }
  .label {
    font-size: 11px;
    font-weight: 700;
    color: rgba(255,255,255,0.4);
    letter-spacing: 1px;
    text-transform: uppercase;
    margin-bottom: 10px;
  }
  .btn {
    display: block;
    width: 100%;
    padding: 16px;
    margin-bottom: 10px;
    border: none;
    border-radius: 14px;
    font-size: 16px;
    font-weight: 700;
    cursor: pointer;
    text-decoration: none;
    -webkit-tap-highlight-color: transparent;
    transition: opacity .15s;
  }
  .btn:active { opacity: .75; }
  .btn-main {
    background: #98C01F;
    color: #0f1f0a;
    font-size: 18px;
    padding: 18px;
  }
  .btn-sec {
    background: rgba(255,255,255,0.08);
    color: #fff;
  }
  .divider {
    height: 1px;
    background: rgba(255,255,255,0.1);
    margin: 18px 0;
  }
  .btn-mgmt {
    background: transparent;
    border: 1px solid rgba(255,255,255,0.2);
    color: rgba(255,255,255,0.5);
    font-size: 12px;
    padding: 12px;
    border-radius: 10px;
    display: block;
    width: 100%;
    text-decoration: none;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
  }
  .btn-mgmt:active { opacity: .6; }
</style>
</head>
<body>
<div class="wrap">
  <div class="logo">
    <h1>NASCH</h1>
    <p>Mitarbeiter-App · Filiale auswählen</p>
  </div>

  <div class="label">Meine Filiale</div>

  <a href="emsdetten.html" class="btn btn-main">🏪 Emsdetten</a>
  <a href="lohne.html"     class="btn btn-sec">🏪 Lohne</a>
  <a href="werlte.html"    class="btn btn-sec">🏪 Werlte</a>
  <a href="loeningen.html" class="btn btn-sec">🏪 Löningen</a>

  <div class="divider"></div>

  <a href="leitung.html" class="btn-mgmt">⚙️ Leitung & Personalbüro</a>
</div>
</body>
</html>
